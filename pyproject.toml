[project]
name = "math-solver"
version = "0.1.0"
description = "Ukrainian grade-5 math solving with Gemma 3 4B models"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = [
  "transformers>=4.50",
  "accelerate>=1.0",
  "peft>=0.14",
  "bitsandbytes>=0.45",
  "trl>=0.15",
  "datasets>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
