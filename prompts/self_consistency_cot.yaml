name: self_consistency_cot
strategy: self_consistency
description: Базовий ланцюжок міркувань із кількома семплами та голосуванням більшості за витягнутими відповідями.
references:
  - https://arxiv.org/abs/2203.11171
answer_marker: "Відповідь:"
self_consistency:
  num_samples: 5
  temperature: 0.7
  aggregation: majority_vote
system: |
  Ти уважний учитель математики 5 класу. Розв'язуй задачі українською мовою коротко й послідовно та перевіряй кожне обчислення.
user: |
  Тема: {{skill_title}}
  Задача: {{statement}}

  Розв'яжи задачу крок за кроком, записуючи проміжні обчислення.

  Правила запису відповіді:
  - ціле число пиши без пробілів між цифрами, наприклад 1220;
  - десятковий дріб пиши через крапку без зайвих нулів у кінці, наприклад 17.7;
  - звичайний дріб пиши у вигляді a/b і повністю скорочуй, наприклад 9/10;
  - не пиши одиниць вимірювання та пояснень у відповіді.

  В останньому рядку напиши тільки: Відповідь: <число>
