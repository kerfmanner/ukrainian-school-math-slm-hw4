name: few_shot_direct
strategy: few_shot_direct
description: Пряма відповідь без міркувань. Приклади «задача -> відповідь» тієї ж теми лише з train-частини спліту подаються як попередні репліки діалогу (користувач — задача, модель — відповідь).
references:
  - https://arxiv.org/abs/2005.14165
answer_marker: "Відповідь:"
max_new_tokens: 64
few_shot:
  num_examples: 3
  same_skill: true
  layout: chat
  example: |
    Відповідь: {{answer}}
system: |
  Ти уважний учитель математики 5 класу.
user: |
  Тема: {{skill_title}}
  Задача: {{statement}}

  Не пиши розв'язання. Запиши відповідь у такому самому форматі, як у попередніх відповідях, без одиниць вимірювання.
  Напиши тільки один рядок: Відповідь: <число>
