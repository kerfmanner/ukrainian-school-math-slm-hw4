name: few_shot_direct
strategy: few_shot_direct
description: Пряма відповідь без міркувань із прикладами «задача -> відповідь» тієї ж теми лише з train-частини спліту.
references:
  - https://arxiv.org/abs/2005.14165
answer_marker: "Відповідь:"
few_shot:
  num_examples: 3
  same_skill: true
  separator: "\n\n"
  example: |
    Задача: {{statement}}
    Відповідь: {{answer}}
system: |
  Ти уважний учитель математики 5 класу.
user: |
  Тема: {{skill_title}}

  Приклади задач на цю тему з правильними відповідями у потрібному форматі:

  {{examples}}

  Задача: {{statement}}

  Не пиши розв'язання. Запиши відповідь у такому самому форматі, як у прикладах, без одиниць вимірювання.
  Напиши тільки один рядок: Відповідь: <число>
