name: few_shot_cot
strategy: few_shot_cot
description: Ланцюжок міркувань із розв'язаними прикладами тієї ж теми лише з train-частини спліту, поданими як попередні репліки діалогу (користувач — задача, модель — розв'язання й відповідь); приклад показується тільки разом із розв'язанням (перевірене teacher-розв'язання з JSONL або непорожні steps).
references:
  - https://arxiv.org/abs/2005.14165
  - https://arxiv.org/abs/2201.11903
answer_marker: "Відповідь:"
few_shot:
  num_examples: 3
  same_skill: true
  layout: chat
  solution_sources: [worked, steps]
  require_solution: true
  steps_template: "Проміжні обчислення: {{steps}}"
  steps_separator: ", "
  example: |
    {{solution}}
    Відповідь: {{answer}}
system: |
  Ти уважний учитель математики 5 класу. Розв'язуй задачі українською мовою коротко й послідовно та перевіряй кожне обчислення.
user: |
  Тема: {{skill_title}}
  Задача: {{statement}}

  Розв'яжи задачу крок за кроком, записуючи проміжні обчислення.
  Запиши відповідь у такому самому форматі, як у попередніх відповідях: ціле число без пробілів, десятковий дріб через крапку без зайвих нулів, звичайний дріб як a/b у нескоротному вигляді, без одиниць вимірювання.

  В останньому рядку напиши тільки: Відповідь: <число>
