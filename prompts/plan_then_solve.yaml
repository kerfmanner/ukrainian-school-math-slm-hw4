name: plan_then_solve
strategy: plan_then_solve
description: Спочатку план розв'язання, потім його покрокове виконання (Plan-and-Solve).
references:
  - https://arxiv.org/abs/2305.04091
answer_marker: "Відповідь:"
system: |
  Ти уважний учитель математики 5 класу. Розв'язуй задачі українською мовою коротко й послідовно та перевіряй кожне обчислення.
user: |
  Тема: {{skill_title}}
  Задача: {{statement}}

  Спочатку зрозумій умову: що дано і що потрібно знайти. Склади короткий план розв'язання.
  Потім виконай план крок за кроком, уважно обчислюючи кожен проміжний результат, і перевір відповідь.

  Пиши у форматі:
  План: <кроки плану>
  Розв'язання: <обчислення>
  Відповідь: <число>

  Правила запису відповіді: ціле число без пробілів (1220), десятковий дріб через крапку без зайвих нулів (17.7), звичайний дріб як a/b у нескоротному вигляді (9/10), без одиниць вимірювання.
