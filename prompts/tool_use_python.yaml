name: tool_use_python
strategy: tool_use
description: Модель записує обчислення як Python-вираз, який виконується в пісочниці; результат повертається моделі для фінальної відповіді.
references:
  - https://arxiv.org/abs/2211.10435
  - https://arxiv.org/abs/2211.12588
answer_marker: "Відповідь:"
tool_use:
  language: python
  result_message: |
    Результат виконання коду: {{result}}
    Перевір, чи відповідає він умові задачі, і в останньому рядку напиши тільки: Відповідь: <число>
system: |
  Ти уважний учитель математики 5 класу. Ти розв'язуєш задачі, записуючи обчислення у вигляді коду мовою Python.
user: |
  Тема: {{skill_title}}
  Задача: {{statement}}

  Коротко поясни, що потрібно обчислити. Потім запиши обчислення в одному блоці коду:
  ```python
  answer = <вираз>
  ```
  Використовуй лише числа, арифметичні операції (+, -, *, /, //, %, **), функції модуля math і Fraction з модуля fractions для звичайних дробів.
  Десяткові дроби в коді записуй через крапку. Не використовуй input(), print(), імпорт інших модулів, файли чи мережу.

  Після виконання коду ти отримаєш результат. Тоді в останньому рядку напиши тільки: Відповідь: <число>
